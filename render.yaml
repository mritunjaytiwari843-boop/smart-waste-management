# Render Blueprint: one web service that serves the API and the built React site.
services:
  - type: web
    name: smart-waste-management
    runtime: node
    plan: free

    buildCommand: npm run render-build
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: NODE_VERSION
        value: 20

      - key: NPM_CONFIG_PRODUCTION
        value: "false"

      - key: MONGODB_URI
        sync: false

      - key: JWT_SECRET
        generateValue: true

      - key: ADMIN_EMAIL
        sync: false

      - key: ADMIN_PASSWORD
        sync: false
